.pl-leg{display:flex;justify-content:center;gap:14px;margin:12px 0 4px;font-size:12px;font-weight:700;color:var(--muted)}
.pl-leg span{display:flex;align-items:center;gap:6px}
.pl-det{margin-top:12px;padding:14px;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,var(--card2)),var(--card2) 70%);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);animation:vin .45s var(--ease) both}
.pl-dh{display:flex;align-items:center;gap:12px}
.pl-dic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:900;font-size:18px;color:#fff;background:var(--c);box-shadow:0 6px 14px color-mix(in srgb,var(--c) 35%,transparent)}
.pl-det.s-miss .pl-dic,.pl-det.s-rest .pl-dic,.pl-det.s-none .pl-dic{background:var(--card3);color:var(--muted);box-shadow:none}
.pl-det.s-plan .pl-dic{background:transparent;color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.pl-dh .grow{flex:1;min-width:0}
.pl-dh small{display:block;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-dh h4{margin:1px 0 0;font-family:var(--disp);font-size:19px;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-dst{flex:none;padding:5px 10px;border-radius:10px;font-size:11.5px;font-weight:900;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--text)}
.pl-det.s-miss .pl-dst{background:color-mix(in srgb,var(--c-rouge) 16%,transparent)}
.pl-dk{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.pl-dk span{flex:1;min-width:64px;padding:8px;border-radius:14px;background:var(--card);font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.pl-dk b{display:block;font-family:var(--disp);font-size:16px;color:var(--text)}
.pl-dl{margin-top:8px}
.pl-dl .dl{align-items:center;gap:10px}
.pl-dl .dl .thumb{width:34px;height:34px;border-radius:10px;flex:none}
.pl-dl .dl .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.pl-delta{margin-top:14px;flex:none;padding:4px 9px;border-radius:10px;font-size:12px;font-weight:900;background:color-mix(in srgb,var(--c-vert) 18%,transparent);color:color-mix(in srgb,var(--c-vert) 70%,var(--text))}
.pl-delta.neg{background:color-mix(in srgb,var(--c-rouge) 16%,transparent);color:color-mix(in srgb,var(--c-rouge) 70%,var(--text))}
.pl-delta.flat{background:var(--card2);color:var(--muted)}
.pl-vt b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1}
.pl-vt span{font-size:12px;font-weight:700;color:var(--muted)}
.pl-bars{position:relative;height:150px;margin-top:6px;padding-top:20px}
.pl-bars .vb i{position:relative;width:100%;max-width:30px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,var(--card3),color-mix(in srgb,var(--card3) 60%,transparent))}
.pl-bars .vb i.cur{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent) 50%,color-mix(in srgb,var(--accent) 65%,#000));box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.pl-bars .vb i.top:not(.cur){background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 45%,var(--card3)),var(--card3))}
.pl-bars .vb i em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:4px;font-style:normal;font-size:10.5px;font-weight:900;white-space:nowrap}
.pl-avg{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed color-mix(in srgb,var(--muted) 55%,transparent);z-index:0;pointer-events:none}
.pl-avg em{position:absolute;left:0;top:-14px;font-style:normal;font-size:9.5px;font-weight:900;color:var(--muted);text-transform:uppercase}
.pl-chips{display:flex;gap:6px;margin:0 -16px 12px;padding:0 16px}
.pl-chip{flex:none;display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:14px;background:var(--card2);font-size:12.5px;font-weight:800;color:var(--muted);transition:background-color .3s,color .3s}
.pl-chip img{width:28px;height:28px;border-radius:9px;object-fit:cover}
.pl-chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.pc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pc-head b{display:block;font-family:var(--disp);font-size:28px;line-height:1.1}
.pc-head span{font-size:12px;font-weight:700;color:var(--muted)}
.pc-head .pl-delta{margin-top:4px}
.pl-chart{height:auto;margin-top:8px}
.pl-ax{font-size:9.5px;font-weight:800;fill:var(--muted)}
.pl-chart .pt.last{animation:vin .6s var(--ease) both,plPulse 2s ease-in-out 1.2s infinite}
@keyframes plPulse{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 6px var(--accent))}}
@media (prefers-reduced-motion:reduce){.pl-fl,.pl-chart .pt.last{animation:none}}
.pl-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pl-row:first-child{border-top:0}
.pl-row .thumb{width:38px;height:38px;border-radius:11px;flex:none}
.pl-row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-row b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-row small{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pw-dn{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 5px;margin:14px 0 6px;text-align:center;font-size:11px;font-weight:900;color:var(--muted)}
.pw-dn .we{opacity:.6}
.pw-cal{display:flex;flex-direction:column;gap:7px}
.pw-wk{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:5px;border-radius:20px;background:var(--glass,var(--card2));border:1px solid var(--line);animation:vin .5s var(--ease) calc(var(--k)*.05s) both}
.pw-wk.cur{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.pw-wk.full{background:linear-gradient(90deg,color-mix(in srgb,var(--c-orange) 12%,var(--card2)),var(--card2))}
.pw-fire{position:absolute;right:-6px;top:-8px;font-size:15px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));animation:popIn .5s var(--spring) .4s both}
.pw{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:15px;min-width:0;transition:transform .35s var(--spring),background-color .35s}
.pw .n{font-size:15px;font-weight:800;line-height:1.1}
.pw .tg{display:block;max-width:calc(100% - 4px);min-height:13px;padding:2px 3px;border-radius:6px;font-size:7.5px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:clip;color:var(--dc)}
.pw:not(.st-rest):not(.st-none){background:color-mix(in srgb,var(--dc) 11%,transparent)}
.pw.st-done .tg::before{content:"✓ "}
.pw.st-done .tg{background:var(--dc);color:#fff;box-shadow:0 3px 8px color-mix(in srgb,var(--dc) 35%,transparent)}
.pw.st-plan .tg{box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--dc) 60%,transparent)}
.pw.st-part .tg{background:color-mix(in srgb,var(--dc) 35%,transparent);color:var(--text)}
.pw.st-miss{background:transparent!important}
.pw.st-miss .n{color:var(--muted)}
.pw.st-miss .tg{opacity:.55;text-decoration:line-through;text-decoration-thickness:1.5px}
.pw.st-rest .tg,.pw.st-none .tg{color:var(--muted)}
.pw.st-rest .tg::before{content:"·";font-size:12px;line-height:.8}
.pw .ck{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;background:var(--dc);color:#fff;box-shadow:0 0 0 1.5px var(--card)}
.pw .ck svg{width:8px;height:8px}
.pw.out{opacity:.32}
.pw.tod:not(.sel) .n{color:var(--accent)}
.pw.tod:not(.sel)::after{content:"";position:absolute;bottom:-3px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--accent)}
.pw.sel{z-index:2;color:#fff;transform:translateY(-2px) scale(1.06);background:linear-gradient(165deg,color-mix(in srgb,var(--dc) 70%,#fff) 0%,var(--dc) 45%,color-mix(in srgb,var(--dc) 75%,#000) 100%)!important;box-shadow:0 10px 24px color-mix(in srgb,var(--dc) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.pw.sel.st-rest,.pw.sel.st-none{--dc:var(--accent)}
.pw.sel .n{font-size:17px;color:#fff}
.pw.sel .tg{color:#fff!important;background:rgba(255,255,255,.24)!important;opacity:1!important;text-decoration:none!important;box-shadow:none!important}
.pw.sel .ck{background:#fff;color:var(--dc);box-shadow:none}
.pw.sel::before{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;border-radius:2px;background:color-mix(in srgb,var(--dc) 78%,#000);transform:rotate(45deg);z-index:-1}
.pw-leg{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 6px;margin:14px 0 4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.pw-lc{padding:2px 4px;border-radius:5px;font-size:7.5px;font-weight:900;color:var(--accent);margin-left:6px}
.pw-lc.done{background:var(--accent);color:#fff}
.pw-lc.plan{box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--accent) 60%,transparent)}
.pw-lc.miss{opacity:.55;text-decoration:line-through;color:var(--muted)}
.pw-lc.fire{font-size:11px;padding:0}
/* ===== Nutrition ===== */
.np-hero{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:16px;padding:18px 16px;border-radius:28px;color:#fff;
  background:radial-gradient(130% 150% at 0% 0%,color-mix(in srgb,var(--accent) 70%,#fff) 0%,var(--accent) 42%,color-mix(in srgb,var(--accent) 55%,#000) 100%);box-shadow:0 16px 36px color-mix(in srgb,var(--accent) 32%,transparent)}
.np-hero.ok{background:radial-gradient(130% 150% at 0% 0%,#8BF0C4 0%,var(--c-vert) 42%,#08563A 100%);box-shadow:0 16px 36px color-mix(in srgb,var(--c-vert) 32%,transparent)}
.np-hero .ep-rays{left:66px;opacity:.2}
.np-ring{position:relative;width:118px;height:118px;flex:none}
.np-ring svg{width:100%;height:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.2))}
.np-ring .arc{transition:stroke-dashoffset 1.2s var(--ease)}
.np-ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.np-ring .v span{font-family:var(--disp);font-size:36px;line-height:1;letter-spacing:-.02em}
.np-ring .v small{font-size:11.5px;font-weight:800;opacity:.85;margin-top:2px}
.np-side{flex:1;min-width:0}
.np-side small{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.np-side h3{font-family:var(--disp);font-size:23px;line-height:1.1;margin:4px 0 4px}
.np-side p{margin:0 0 10px;font-size:12.5px;font-weight:700;opacity:.9;line-height:1.35}
.np-tgt{display:inline-flex;align-items:center;gap:4px;padding:3px;border-radius:14px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.np-tgt button{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.2);font-size:17px;font-weight:800;color:#fff}
.np-tgt span{padding:0 6px;font-size:12px;font-weight:700;white-space:nowrap}
.np-more{margin-top:14px;display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,var(--card2));font-size:12.5px;font-weight:800;color:var(--text)}
.np-more svg{width:14px;height:14px}
.np-q{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.np-qb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px 10px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center;animation:popIn .45s var(--spring) var(--d) both}
.np-qb .e{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:var(--card2);margin-bottom:3px}
.np-qb b{font-size:12.5px;font-weight:800;line-height:1.2;min-height:2.4em;display:flex;align-items:center}
.np-qb .gp{padding:3px 8px;border-radius:9px;background:color-mix(in srgb,var(--accent) 16%,transparent);font-size:12px;font-weight:900}
.np-qb small{font-size:10.5px;font-weight:700;color:var(--muted)}
.np-qb.main{color:#fff;border-color:transparent;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 75%,#fff),var(--accent) 50%,color-mix(in srgb,var(--accent) 65%,#000));box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.np-qb.main .e{background:rgba(255,255,255,.22)}
.np-qb.main .gp{background:rgba(255,255,255,.25)}
.np-qb.main small{color:rgba(255,255,255,.85)}
.np-qb:active{transform:scale(.95)}
.np-custom{display:flex;align-items:center;gap:8px;margin-top:10px;padding:6px 6px 6px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.np-custom input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-weight:700;font-size:15px;color:var(--text);outline:none}
.np-custom button{padding:11px 16px;border-radius:13px;background:var(--text);color:var(--bg);font-weight:800}
.np-log{position:relative;display:flex;flex-direction:column;gap:6px}
.np-li{position:relative;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line);animation:vin .45s var(--ease) var(--d) both}
.np-t{width:38px;flex:none;font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.np-e{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:20px;background:var(--card2)}
.np-li .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.np-li b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-li small{font-size:11.5px;font-weight:700;color:var(--muted)}
.np-g{flex:none;padding:5px 9px;border-radius:10px;background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:900;font-size:13px}
.np-li .del{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.np-li .del svg{width:15px;height:15px}
.np-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;border-radius:20px;border:1.5px dashed var(--line);color:var(--muted);font-weight:700;font-size:13.5px;text-align:center}
.np-empty span{font-size:28px}
.np-wt b{font-family:var(--disp);font-size:22px;margin-right:8px}
.np-wt span{font-size:12.5px;font-weight:700;color:var(--muted)}
.np-bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:160px;margin-top:6px;padding-top:18px}
.np-goal{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed color-mix(in srgb,var(--c-vert) 70%,transparent);pointer-events:none}
.np-goal em{position:absolute;left:0;top:-15px;font-style:normal;font-size:9.5px;font-weight:900;color:color-mix(in srgb,var(--c-vert) 70%,var(--text))}
.np-b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.np-b i{position:relative;width:100%;max-width:30px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,var(--card3),color-mix(in srgb,var(--card3) 55%,transparent));transform-origin:bottom;animation:grow .8s var(--ease) calc(var(--j)*.05s) both}
.np-b i.ok{background:linear-gradient(180deg,color-mix(in srgb,var(--c-vert) 75%,#fff),var(--c-vert) 55%,color-mix(in srgb,var(--c-vert) 65%,#000));box-shadow:0 6px 14px color-mix(in srgb,var(--c-vert) 30%,transparent)}
.np-b.tod i:not(.ok){background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 75%,#fff),var(--accent))}
.np-b i em{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:3px;font-style:normal;font-size:9.5px;font-weight:900;white-space:nowrap}
.np-b span{font-size:11px;font-weight:800;color:var(--muted)}
.np-b.tod span{color:var(--text)}
/* ===== Programme ===== */
.pg-hero{position:relative;overflow:hidden;isolation:isolate;padding:16px 14px 12px;border-radius:28px;color:#fff;
  background:radial-gradient(130% 150% at 0% 0%,color-mix(in srgb,var(--appc) 75%,#fff) 0%,var(--appc) 42%,color-mix(in srgb,var(--appc) 34%,#0c0a1c) 100%);box-shadow:0 16px 36px color-mix(in srgb,var(--appc) 32%,transparent)}
.pg-hero .ep-rays{left:auto;right:-220px;top:20px;opacity:.16}
.pg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 2px}
.pg-top small{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.pg-top b{display:block;font-family:var(--disp);font-size:26px;line-height:1.15}
.pg-top b span{font-size:15px;opacity:.8}
.pg-top p{margin:2px 0 0;font-size:12.5px;font-weight:700;opacity:.88}
.pg-goals{display:flex;gap:2px;padding:6px 8px;border-radius:14px;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);font-size:18px;flex:none}
.pg-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px;padding:5px;border-radius:20px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.pg-d{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 8px;border-radius:15px;background:linear-gradient(165deg,color-mix(in srgb,var(--dc) 70%,#fff) 0%,var(--dc) 50%,color-mix(in srgb,var(--dc) 75%,#000) 100%);box-shadow:0 6px 14px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35);animation:popIn .45s var(--spring) var(--d) both;min-width:0}
.pg-d .l{font-size:11px;font-weight:900;opacity:.9}
.pg-tg{max-width:calc(100% - 4px);padding:2px 3px;border-radius:6px;background:rgba(255,255,255,.24);font-size:7.5px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.pg-d.rest{background:rgba(255,255,255,.08);box-shadow:none}
.pg-d.rest .pg-tg{background:transparent;font-size:12px;line-height:.9;opacity:.7}
.pg-d.tod{outline:2px solid #fff;outline-offset:1px}
.pg-d:active{transform:scale(.92)}
.pg-hint{margin:8px 0 0;text-align:center;font-size:11px;font-weight:700;opacity:.75}
.pg-list{display:flex;flex-direction:column;gap:8px}
.pg-c{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;padding:14px 12px 14px 18px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;animation:vin .5s var(--ease) var(--d) both}
.pg-cb{position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.pg-c::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 12%,transparent),transparent 55%);pointer-events:none}
.pg-c .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.pg-ct{font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.pg-c b{font-family:var(--disp);font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-meta{font-size:12px;font-weight:700;color:var(--muted)}
.pg-days{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pg-days i{font-style:normal;padding:2px 7px;border-radius:7px;background:var(--c);color:#fff;font-size:10.5px;font-weight:900}

html.safe .tabs{background:var(--card)!important}
</style>

fentes:E("Dumbbell_Lunges","Fentes haltères","Jambes",["Quadriceps","Fessiers"],["Debout, un haltère dans chaque main, buste droit.","Grand pas en avant, genou arrière qui frôle le sol.","Pousse sur le pied avant pour revenir, puis change de jambe."],DB),

abduc:E("Thigh_Abductor","Abduction machine","Jambes",["Fessiers","Moyen fessier"],["Assis(e) bien au fond, coussins contre l'extérieur des genoux.","Écarte les jambes le plus loin possible en contrôlant.","Reviens lentement sans laisser les charges se toucher."]),

hipthrust:E("Barbell_Hip_Thrust","Hip thrust","Jambes",["Fessiers","Ischios"],["Haut du dos contre le banc, barre sur les hanches avec un coussin.","Monte les hanches jusqu'à l'alignement genoux-épaules.","Serre les fessiers en haut, redescends lentement."],BAR),

ellip:E("Elliptical_Trainer","Vélo elliptique","Cardio",["Cardio","Jambes","Bras"],["Monte, pieds bien à plat sur les pédales, mains sur les poignées mobiles.","Pousse avec les jambes et tire avec les bras, en rythme.","Monte le niveau quand ça devient facile. Doux pour les genoux."],{noW:true,cardio:{met:5.5}}),

course:E("Trail_Running_Walking","Course en extérieur","Cardio",["Cardio","Jambes"],["Commence par 5 min de marche rapide.","Cours à une allure où tu peux encore parler. Débutant : alterne 1 min de course et 1 min de marche.","Lance le suivi GPS dans FIT KEEF : distance, allure et parcours se notent tout seuls."],{noW:true,cardio:{met:9.5,d:1,gps:"course"}}),

/* ================= STATE ================= */
var KEY="seance:v4";
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addD(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function wIdx(s){return (parse(s).getDay()+6)%7;}
function monday(s){return addD(s,-wIdx(s));}
var NOW=new Date(),TODAY=iso(NOW);
var st;
function fresh(){return{v:4,wk:DEFAULT_WK(),plan:DEFAULT_PLAN.slice(),lib:{},w:{},sess:{},prot:{},target:140,start:TODAY,set:{sound:true,step:2.5},seen:false,notes:{},body:[],bSeen:[],lvlSeen:1,nut:null,nutR:[],runs:{},jok:{},goals:{}};}
function assign(p){for(var k in st)if(p[k]!==undefined)st[k]=p[k];st.v=4;}
function load(){
  st=fresh();
  try{
    var r=localStorage.getItem(KEY);
    if(r){var p=JSON.parse(r);if(p&&p.v===4){assign(p);return;}}
    var r3=localStorage.getItem("seance:v3");
    if(r3){var p3=JSON.parse(r3);if(p3&&p3.v===3){assign(p3);upgrade(true);save();return;}}
    var o=localStorage.getItem("seance:v2");
    if(o){migrate(JSON.parse(o));upgrade(true);save();}
  }catch(e){}
}
function upgrade(markSeen){
  Object.keys(st.sess).forEach(function(d){var s=st.sess[d];if(!s.list)return;Object.keys(s.sets||{}).forEach(function(id){var it=s.list.filter(function(x){return x.id===id;})[0];s.sets[id]=(s.sets[id]||[]).map(function(v){return v==null?null:(typeof v==="number"?{w:v,r:it?it.lo:10}:v);});});});
  st.notes=st.notes||{};st.body=st.body||[];st.bSeen=st.bSeen||[];
  if(markSeen){var R=computeAll();st.bSeen=earnedBadges(R);st.lvlSeen=levelOf(totalXP(R)).n;}
}
function migrate(o){
  st.w=o.w||{};st.target=o.target||140;st.seen=true;
  var dw=DEFAULT_WK();
  Object.keys(o.prot||{}).forEach(function(d){st.prot[d]=(o.prot[d]||[]).slice();});
  var dates=Object.keys(o.sess||{}).sort();
  dates.forEach(function(d){
    var os=o.sess[d],wk=DEFAULT_PLAN[wIdx(d)];if(!wk)return;
    var s=build(wk,dw),any=false;
    s.list.forEach(function(it){var a=(os.sets||{})[it.id]||[],w=parseFloat(st.w[it.id])||0,arr=[];for(var j=0;j<it.s;j++){arr.push(a[j]?(LIB[it.id]&&LIB[it.id].noW?0:w):null);if(a[j])any=true;}s.sets[it.id]=arr;});
    s.done=!!os.done;if(any||s.done)st.sess[d]=s;
  });
  if(dates.length&&dates[0]<st.start)st.start=dates[0];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));localStorage.setItem(KEY+":ts",String(Date.now()));}catch(e){}cloudQueue();}

var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function lib(id){return LIB[id]||st.lib[id]||{n:"Exercice",g:"Abdos",mu:[],st:[]};}
function col(c){return "var(--c-"+(c||"violet")+")";}
function fmt(n){return (Math.round(n*10)/10).toLocaleString("fr-FR");}
function reps(it){return (it.lo===it.hi?it.lo:it.lo+"-"+it.hi)+(it.suf||"");}

    var sc=0,mu=L.mu||[];if(m0&&mu[0]===m0)sc+=6;else if(m0&&mu.indexOf(m0)>=0)sc+=3;if(L.g===L0.g)sc+=2;
    (L0.mu||[]).forEach(function(x){if(mu.indexOf(x)>=0)sc+=1;});if(sc<5)return;var E=lxEq(L)[0];if(E!==E0)sc+=1.5;
    var h=hist(k,ui.sel);if(h.length)sc+=2;out.push({id:k,sc:sc,E:E,h:h[0]||null});});
  out.sort(function(a,b){return b.sc-a.sc;});var seen={},pick=[];out.forEach(function(x){if(pick.length>=4)return;if(seen[x.E]&&out.length>6&&pick.length<3)return;seen[x.E]=1;pick.push(x);});
  if(pick.length<4)out.forEach(function(x){if(pick.length<4&&pick.indexOf(x)<0)pick.push(x);});return pick;}

var SFXC=null;
function sfxCtx(){try{if(!SFXC)SFXC=new (window.AudioContext||window.webkitAudioContext)();if(SFXC.state==="suspended")SFXC.resume();}catch(e){SFXC=null;}return SFXC;}

function sfxTone(c,t,f,d,type,vol,f2){var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);}
function SFX(k){if(!st||!st.set||st.set.fx===false)return;var c=sfxCtx();if(!c)return;var t=c.currentTime+.01,v=.09;
  if(k==="tap")sfxTone(c,t,1400,.05,"sine",v*.6,900);
  else if(k==="set"){sfxTone(c,t,660,.12,"sine",v,880);sfxTone(c,t+.07,990,.18,"sine",v*.8);}
  else if(k==="pr"){[523,659,784,1047].forEach(function(f,i){sfxTone(c,t+i*.075,f,.32,"triangle",v*.9);});sfxTone(c,t+.3,2093,.5,"sine",v*.35);}
  else if(k==="tick")sfxTone(c,t,1046,.06,"sine",v*.8);
  else if(k==="go"){sfxTone(c,t,784,.14,"triangle",v);sfxTone(c,t+.1,1175,.3,"triangle",v);}
  else if(k==="done"){[392,523,659,784,1047].forEach(function(f,i){sfxTone(c,t+i*.09,f,.45,"triangle",v*.85);});[1568,2093].forEach(function(f,i){sfxTone(c,t+.5+i*.08,f,.6,"sine",v*.3);});}
  else if(k==="whoosh")sfxTone(c,t,300,.25,"sine",v*.5,1200);}

function nsCalc(S){
  var bmr=10*S.w+6.25*S.h-5*S.age+(S.sex==="F"?-161:5),tdee=bmr*NACT[S.act][2],k;
  if(S.goal==="cut")k=tdee-Math.min(500,tdee*0.2);else if(S.goal==="bulk")k=tdee+250;else k=tdee;
  k=Math.max(k,S.sex==="F"?1200:1500,bmr);k=Math.round(k/10)*10+(S.adj||0);
  var p=Math.round(S.w*(S.goal==="cut"?2:1.8)/5)*5,f=Math.max(Math.round(S.w*0.9),Math.round(k*0.25/9)),c=Math.max(0,Math.round((k-p*4-f*9)/4));

}

      if(inM){a.forEach(function(x){M.vol+=Math.max(0,x.w)*x.r;});if(best[it.id]>0&&mw>best[it.id])M.prs.push({id:it.id,w:mw,g:mw-best[it.id]});}

  if(!EPIO)EPIO=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){EPIO.unobserve(e.target);var t=e.target;if(document.body.classList.contains("busy"))setTimeout(function(){run(t);},520);else run(t);}});},{threshold:.6});
